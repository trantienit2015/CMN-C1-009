# Agent Manifest — AgentRegistry entry point.
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest them under an `agent:` block. The nested shape is
# invisible to the registry (keys fall back to defaults / KeyError) and loads
# as AgentUnavailableError -> HTTP 503. See CLAUDE.md §5-0.
id: "CMN-C1-009"
name: "ClassificationAgent"
namespace: "cmn"
version: "0.1.2"
enabled: true
category: "Cat 1"
industry: "CMN"

# Opaque compatibility metadata — not an inheritance selector or gate input.
base_type: "ChatAgent"

# Entry point — a SINGLE dotted import path (module.Class), never a split
# module:/class: pair. AgentRegistry does class.rsplit(".", 1).
class: "src.graph.graph.ClassificationAgent"

# Security — see CLAUDE.md §3 TrustLevel table.
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache). require_at_compile()
# fails closed: a listed-but-unavailable secret makes the agent return 503.
# Every ctx.secrets.require("KEY") in src/ must be listed under secrets.
# Every value under extras must exist in shared/utils/extras_map.py EXTRAS_MAP.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]

# Runtime parameters (max_retry, timeout_s, hitl.*, memory_enabled, ...) are NOT
# part of this manifest — AgentRegistry loads config/config.yaml separately and
# passes it as Graph(config=...). Do NOT put them here.
